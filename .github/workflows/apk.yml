# Compila el APK de Android cada vez que se sube un cambio a main.
# Resultado: Releases → "Raíces de Niebla X.Y.Z" → raices-de-niebla-X.Y.Z.apk  (y también en Actions → Artifacts)
name: APK Android

on:
  push:
    branches: [main]
    paths: ['index.html', 'vendor/**', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Versión del juego
        run: |
          VN=$(grep -oP "const VERSION='\K[^']+" index.html)
          test -n "$VN"
          echo "VN=$VN" >> "$GITHUB_ENV"
          echo "Versión $VN, compilación ${{ github.run_number }}"

      - name: Copiar el juego dentro de la app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html android/app/src/main/assets/www/
          cp -r vendor android/app/src/main/assets/www/

      - name: Compilar
        working-directory: android
        run: gradle assembleRelease -Pvn="$VN" -Pvc="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Nombrar el APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "raices-de-niebla-$VN.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: raices-de-niebla-${{ env.VN }}
          path: raices-de-niebla-${{ env.VN }}.apk

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F="raices-de-niebla-$VN.apk"
          if gh release view "v$VN" >/dev/null 2>&1; then
            gh release upload "v$VN" "$F" --clobber
          else
            gh release create "v$VN" "$F" --title "Raíces de Niebla $VN" --latest \
              --notes "APK de Android de la versión $VN. Se instala encima de la anterior sin perder la partida. Cambios: ver CHANGELOG.md."
          fi
