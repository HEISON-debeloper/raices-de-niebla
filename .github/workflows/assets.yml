# Descarga recursos CC0 de Poly Haven (prueba/assets.json), los optimiza para el navegador y guarda solo
# la versión optimizada en prueba/assets/ (los originales pesan ~1,7 GB y no se suben).
name: Recursos CC0

on:
  push:
    branches: [main]
    paths: ['prueba/assets.json', 'tools/assets.py', 'tools/optimizar.mjs']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RAW: ${{ runner.temp }}/raw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Descargar de Poly Haven
        run: python3 tools/assets.py
      - name: Optimizar
        run: |
          mkdir -p "$RUNNER_TEMP/opt" && cd "$RUNNER_TEMP/opt"
          npm init -y >/dev/null
          npm i --no-audit --no-fund @gltf-transform/core@4.5.1 @gltf-transform/extensions@4.5.1 @gltf-transform/functions@4.5.1 meshoptimizer@1.0.1 sharp@0.33.5 >/dev/null
          cp "$GITHUB_WORKSPACE/tools/optimizar.mjs" .
          sed -i "s#const ROOT = .*#const ROOT = process.env.GITHUB_WORKSPACE;#" optimizar.mjs
          node optimizar.mjs
          du -sh "$GITHUB_WORKSPACE/prueba/assets"
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prueba/assets
          git diff --cached --quiet && exit 0
          git commit -m "Recursos CC0 de Poly Haven optimizados"
          git push
