# Descarga recursos CC0 de Poly Haven listados en prueba/assets.json y los guarda en el repositorio.
name: Recursos CC0

on:
  push:
    branches: [main]
    paths: ['prueba/assets.json', 'tools/assets.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/assets.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prueba/assets
          git diff --cached --quiet && exit 0
          git commit -m "Recursos CC0 de Poly Haven"
          git push
