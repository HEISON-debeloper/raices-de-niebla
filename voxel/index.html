function fillLeg(){$('leg').innerHTML='<h3>Atlas anatómico</h3><p class="mut">'+(ANAT.done?'Huesos: <b>'+ANAT.bones.size+' / 206</b> · dientes: 32 / 32 · cartílagos: '+ANAT.names.cart.size+' tipos · músculos: <b>'+ANAT.musP.size+' piezas con nombre</b> ('+ANAT.names.mus.size+' tipos) · órganos: <b>'+ANAT.orgP.size+' piezas con nombre</b> ('+ANAT.names.org.size+' tipos).'+[['vaso','Vasos sanguíneos'],['linf','Linfático'],['nerv','Nervios'],['lig','Ligamentos, tendones y bolsas']].map(([k,t])=>ANAT.P[k].size?' · '+t.toLowerCase()+': <b>'+ANAT.P[k].size+' piezas</b> ('+ANAT.names[k].size+' tipos)':'').join('')+'<br><b>Órganos:</b> '+[...ANAT.names.org].sort().join(', ')+'.'+[['vaso','Vasos sanguíneos'],['linf','Linfático'],['nerv','Nervios'],['lig','Ligamentos, tendones y bolsas']].map(([k,t])=>ANAT.P[k].size?'<br><b>'+t+':</b> '+[...ANAT.names[k]].sort().join(', ')+'.':'').join('')+'<br><b>Huesos:</b> '+[...new Set([...ANAT.bones].map(n=>n.replace(/ (izquierd|derech)[oa]$/,'')))].join(', ')+'.<br><b>Músculos:</b> '+[...ANAT.names.mus].sort().join(', ')+'.<br><b>Cartílagos:</b> '+[...ANAT.names.cart].join(', ')+'.':'Abre Menú → Anatomía: cada sistema se construye la primera vez que lo eliges (unos segundos).')+'</p><h3>Novedades v0.22</h3><p class="mut">• El personaje usa los huesos de su anatomía como esqueleto: 23 huesos con las articulaciones tomadas del atlas (discos L5/S1, T12/L1 y C7/T1, atlanto-occipital, esternoclaviculares, hombros, codos, muñecas —radio distal y escafoides—, nudillos, caderas —cabeza del fémur—, rodillas, tobillos —tibia y astrágalo— y ortejos).<br>• La piel ahora es una sola malla que se dobla con los huesos (cada vértice reparte su peso entre hasta 4 huesos): ya no hay cortes en rodillas, codos, hombros ni caderas.<br>• Animación con más huesos: pelvis y tórax giran en sentido contrario al caminar, la cabeza compensa, el tobillo despega en punta con los ortejos doblados y sube el pie en el vuelo; muñecas y dedos acompañan. Al nadar los pies van en punta y la cabeza gira con el cuerpo para respirar.<br>• Cráneo, dientes, oídos y ojos (capas internas) van pegados al hueso de la cabeza.</p><h3>Novedades v0.21</h3><p class="mut">• Agua de lluvia corregida: la lámina delgada (menos de 3 cm) ya no se dibuja como malla que se cortaba con el relieve fino del suelo de 1 cm; ahora la pinta el propio suelo: se oscurece al mojarse y los charcos brillan con el cielo y el sol, siguiendo cada vóxel. La malla del agua solo aparece desde 3 cm (más lejos pide más profundidad, porque los anillos gruesos del suelo son menos precisos).<br>• El nivel del agua se lee suavizado entre celdas de 10 cm: la orilla ya no sale en escalones.<br>• Lluvia más moderada (antes subía 24 cm por minuto; ahora 1,5 cm por minuto) con gotas visibles, y el suelo seco absorbe ~6 cm/h: los charcos se secan solos.<br>• Al nadar las manos giran: entran con el pulgar abajo, tiran con la palma hacia atrás y salen con el meñique primero; flotando, las palmas rotan al remar.</p><h3>Novedades v0.20</h3><p class="mut">• Flotando quieto la boca queda 6 cm sobre el agua (antes la cabeza quedaba debajo).<br>• Crol corregido: el brazo entra adelante, tira por debajo del cuerpo hasta la cadera y vuelve por encima de la espalda con el codo alto. El cuerpo rota sobre su eje con cada brazada.<br>• Animación más suelta: cada articulación se acerca a su pose de forma suave. Patada desde la cadera con la rodilla que llega tarde; flotando, brazos abiertos en remada de ocho y piernas en batidora.</p><h3>Novedades v0.19</h3><p class="mut">• Nado de verdad: cuando el agua pasa del pecho el personaje flota con la boca afuera y se pone horizontal al avanzar (crol: brazos en círculo alternado y patada corta); quieto, rema con los brazos y pedalea.<br>• Avanza hacia donde miras: mira abajo para bucear, arriba para subir; «Saltar» sostenido (o espacio) sube. Al tocar fondo bajo, sale caminando a la orilla.<br>• Aliento: barra «Aire» sobre los botones. Bajo el agua dura 75 s quieto y menos nadando; al agotarse baja la saturación (~0,45 %/s): confusión, pérdida de la conciencia (deja de nadar y se hunde) y muerte por ahogamiento. Respirando se recupera.<br>• Salud muestra el aire y el tiempo sin aire. Prueba: bucea en el río hasta que la barra se ponga roja.</p><h3>Novedades v0.18</h3><p class="mut">• Terreno optimizado sin bajar el tamaño del vóxel: el suelo sin excavar se arma como malla de altura (un vértice por columna, 2 triángulos por celda); antes las pendientes finas ponían 3–4 vértices por columna. ~36 % menos triángulos por baldosa.<br>• Cada anillo se arma en círculo y no en cuadrado (las esquinas las cubre el anillo más grueso que siempre está debajo) y las baldosas viejas se sueltan antes.<br>• Cada vértice ocupa 25 bytes en vez de 52 (normal, color y tipo de suelo en 1 byte): la mitad de memoria de video y de lectura por cuadro.<br>• Abajo ahora se ven los triángulos totales y los que de verdad se dibujan en pantalla.<br>• Donde excavas se sigue usando la malla completa en 3D (paredes, cuevas, corte).</p><h3>Novedades v0.17</h3><p class="mut">• Debajo del agua ya se ve como debajo del agua: la visibilidad baja a 5–11 m según la profundidad, todo toma color verde azulado y se oscurece al bajar.<br>• El agua absorbe primero el rojo: el fondo y el cuerpo sumergidos se ven azulados y más oscuros entre más profundos, también vistos desde fuera.<br>• Cáusticas: líneas de luz que se mueven en el fondo, más fuertes cerca de la superficie.<br>• Desde abajo la superficie ya no es transparente: se ve el cielo solo en el círculo de arriba (ventana de Snell); fuera de él refleja el fondo como un espejo.<br>• Prueba: métete al río o excava un hueco junto al agua y baja la cámara.</p><h3>Novedades v0.16</h3><p class="mut">• El agua ahora es de vóxeles: columnas de 10 × 10 cm que guardan cuánta agua hay sobre el suelo y la pasan a sus vecinas según la diferencia de nivel. Simulada en 25,6 × 25,6 m alrededor del jugador; más lejos queda en su nivel natural.<br>• Si excavas cerca del río o del lago, el hueco se inunda; si rellenas, haces represas; con «Corte» el agua se derrama por el borde.<br>• Herramienta «Agua»: toca el suelo para echar agua (el radio del pincel define el chorro). Menú → «Lluvia» llueve sobre toda la zona.<br>• El nado usa el nivel real del agua bajo el jugador. Abajo se muestra cuánto tarda la simulación del agua por cuadro.</p><h3>Novedades v0.15</h3><p class="mut">• El terreno se calcula en hilos aparte (Web Workers): al caminar el hilo principal gasta ~0,2 ms por cuadro en el terreno (antes hasta 30 ms), así que no hay tirones.<br>• Transiciones invisibles: cada baldosa nueva aparece con la forma de la gruesa y se transforma a su detalle en 0,4 s; al alejarte hace lo mismo al revés antes de borrarse. Las baldosas se mantienen un poco más allá de su anillo para no rehacerlas si vuelves.<br>• Se acabaron las manchas oscuras y los parches que cambiaban: lo fino se dibuja primero y una máscara de píxeles (stencil) impide que el anillo grueso pinte encima.<br>• Menos trabajo para la GPU: los triángulos quedan orientados según la superficie y se descartan las caras traseras.</p><h3>Novedades v0.14</h3><p class="mut">• Terreno por anillos de detalle alrededor del jugador: vóxeles de 1 cm hasta 2 m, 4 cm hasta 8 m, 16 cm hasta 32 m y 64 cm hasta 128 m. Al caminar, los anillos se rehacen por baldosas de 64 × 64 celdas.<br>• El suelo ya no es una matriz de vóxeles: es una función continua (relieve + horizontes) más la lista de lo que excavas o rellenas, así que cada anillo la muestrea a su tamaño, lo excavado se ve igual de lejos y el mundo es infinito.<br>• Cerca del jugador se ve el grosor real de la hojarasca (2–8 cm) y el relieve fino de 1–5 cm. El pasto cubre toda la superficie natural; donde excavas aparecen los horizontes.<br>• Pincel de 2 cm a 1,5 m. «Corte» corta el terreno a la distancia elegida delante del jugador y muestra el perfil hasta 6 m de profundidad. El perfil del suelo se calcula exacto.<br>• Menú → Detalle alto / medio / bajo (1, 2 o 4 veces el tamaño del vóxel). Abajo se muestran los FPS y los triángulos del terreno. Detalle alto ≈ 2,8 millones de triángulos; si el iPhone va lento, prueba medio (≈ 0,9 millones).<br>• Se quitó el modo «Cubos».</p><h3>Novedades v0.13.1</h3><p class="mut">• Arreglado el temblor del personaje: ahora se calcula la altura exacta del suelo bajo los pies (antes subía y bajaba en saltos de 2–3 cm cada cuadro). La cámara sigue la altura de forma suave.<br>• Las lesiones por caída usan la altura real de la caída con la gravedad de la Tierra (9,81 m/s²), no la gravedad del salto del juego: lesión desde ~3,3 m.</p><h3>Novedades v0.13</h3><p class="mut">• Sistema de lesiones que usa la anatomía real. Herramienta «Herir» + arma en el Menú (corte 1,5 cm, punción 10 cm, flecha 18 cm, golpe 70 J, bala 40 cm): el impacto entra por la piel y recorre el cuerpo; cada estructura que atraviesa cuenta.<br>• Sangrado según el calibre de cada vaso (p. ej. femoral ≈ 600 mL/min, radial ≈ 160, digital ≈ 18; venas la mitad) y sangrado interno por órgano (hígado 150, bazo 120, corazón 2 500…). Las heridas pequeñas coagulan solas; las arterias no.<br>• Signos vitales: volumen de sangre (5 L), clase de hemorragia I–IV, pulso, presión sistólica, oxígeno, conciencia y dolor. Muerte por choque (> 50 % de sangre perdida), hipoxia o lesión del tronco encefálico.<br>• Fracturas según la energía y la resistencia de cada hueso; caídas de más de ~3 m fracturan talones, tibias o fémures y desde muy alto la columna. Nervios cortados quitan la función real (radial → mano caída, peroneo → pie caído, ciático → pierna paralizada, médula → parálisis según el nivel); Aquiles roto impide correr y saltar; neumotórax baja el oxígeno.<br>• El cuerpo responde: cojea, no puede correr o saltar, se desploma si queda inconsciente o paralizado, deja rastro de sangre y la herida queda marcada en la piel.<br>• Tratamientos: presión directa, vendar, torniquete (en brazos y piernas), ligar arteria, suturar y entablillar. Panel «Salud» con velocidad del tiempo ×1 a ×600 y «Curar todo».</p><h3>Novedades v0.12</h3><p class="mut">• Sin costuras en rodillas y codos: la pierna y el antebrazo incluyen la parte final del muslo y del brazo, unidas de forma suave; ya no se ve el anillo en la articulación.<br>• Anatomía bajo demanda por sistema: al elegir un modo solo se construye lo que ese modo muestra (por ejemplo, el esqueleto completo en unos segundos), en vez de todo el cuerpo de una vez.</p><h3>Novedades v0.11</h3><p class="mut">• Sistema articular: ~340 piezas con nombre (134 tipos).<br>– Columna: longitudinales anterior y posterior, supraespinoso, nucal, interespinosos y amarillos de cada segmento.<br>– Pelvis: sacroilíacos, sacrotuberosos, sacroespinosos, inguinales, iliolumbares.<br>– Tórax y hombro: esternoclaviculares, costoclaviculares, esternocostales radiados, acromioclaviculares, conoide, trapezoide, coracoacromial, coracohumeral, glenohumerales, cápsula del hombro y bolsa subacromial.<br>– Codo, muñeca y mano: colaterales cubital y radial, anular del radio, radiocarpianos, colaterales del carpo, retináculos flexor y extensor, aponeurosis palmar, tendones flexores y extensores de cada dedo y colaterales de cada articulación de los dedos.<br>– Cadera y rodilla: iliofemoral, pubofemoral, isquiofemoral, redondo, cápsulas, tracto iliotibial, cruzados, colaterales, rotuliano, poplíteo oblicuo, tendón del cuádriceps y bolsas (trocantérea, iliopsoas, suprarrotuliana, prerrotuliana, infrarrotuliana, anserina).<br>– Tobillo y pie: deltoideo, talofibulares, calcaneofibular, tibiofibulares, resorte, plantar largo, retináculos, aponeurosis plantar, tendones de Aquiles, tibiales, peroneos y de cada dedo, bolsa retrocalcánea.<br>– Cabeza: gálea, ligamentos y discos temporomandibulares. Fascia toracolumbar.</p><h3>Novedades v0.10</h3><p class="mut">• Sistema nervioso periférico: ~390 piezas con nombre (111 tipos).<br>– Los 12 pares craneales con sus ramas: olfatorio, óptico, oculomotor, troclear, trigémino (ganglio de Gasser y sus 3 divisiones, lingual), abducens, facial (5 ramas), vestibulococlear, glosofaríngeo, vago (con los laríngeos recurrentes), accesorio e hipogloso.<br>– Los 31 pares de nervios espinales (C1–C8, T1–T12, L1–L5, S1–S5, Co1), cada uno con su ganglio de la raíz dorsal.<br>– Plexo cervical (frénico, auricular mayor, occipitales, transverso del cuello, supraclaviculares); plexo braquial con raíces, troncos y cordones, supraescapular, torácico largo, toracodorsal, pectorales, subescapular, musculocutáneo, axilar, radial, mediano, cubital y sus ramas en antebrazo y mano hasta cada dedo; 11 intercostales y subcostal; plexo lumbar (iliohipogástrico, ilioinguinal, genitofemoral, cutáneo femoral lateral, femoral, obturador, safeno); plexo sacro (ciático, glúteos, pudendo, cutáneo femoral posterior, tibial, plantares, peroneos común, superficial y profundo, sural, digitales del pie).<br>– Sistema autónomo: troncos simpáticos con ganglios cervicales, estrellado, torácicos, lumbares y sacros, ganglio impar, esplácnicos, ganglios celíacos y mesentéricos.</p><h3>Novedades v0.9</h3><p class="mut">• Sistema circulatorio: ~260 vasos con nombre (113 tipos). Arterias: aorta en 4 tramos, coronarias, tronco pulmonar y arterias pulmonares, carótidas común, interna y externa con sus ramas (facial, lingual, maxilar, temporal superficial, occipital, tiroidea superior), vertebrales, basilar, círculo de Willis completo, oftálmicas, torácicas internas, 11 intercostales por lado, tronco celíaco y sus 3 ramas, mesentéricas, renales, suprarrenales, testiculares, lumbares, ilíacas, glúteas, pudendas; en los miembros axilar, braquial, radial, cubital, arcos palmares, digitales, femoral, profunda, circunflejas, poplítea, tibiales, peronea, dorsal del pie, plantares y arco plantar. Venas: cavas, braquiocefálicas, yugulares, facial, retromandibular, senos durales, ácigos y hemiácigos, porta, esplénica, mesentéricas, hepáticas, renales, pulmonares, intercostales, cefálica, basílica, mediana del codo, safenas mayor y menor, femoral, poplítea, tibiales y arcos venosos.<br>• Sistema linfático: conducto torácico, cisterna del quilo, conducto linfático derecho, vasos linfáticos de los miembros y ~120 ganglios por región (cervicales, submandibulares, occipitales, auriculares, supraclaviculares, axilares, mediastínicos, hiliares, paraaórticos, celíacos, mesentéricos, ilíacos, inguinales, epitrocleares y poplíteos).<br>• Los vasos son tubos reales que siguen a cada segmento del cuerpo al moverse.</p><h3>Novedades v0.8</h3><p class="mut">• Órganos completos por aparato (~190 piezas con nombre, 135 tipos):<br>– Nervioso central: 4 lóbulos por hemisferio, ínsula, tálamos, hipotálamo, núcleos caudado y putamen, hipocampos, amígdalas cerebrales, cuerpo calloso, 4 ventrículos, mesencéfalo, puente, bulbo, cerebelo (hemisferios y vermis), hipófisis, pineal, bulbos olfatorios, quiasma óptico, duramadre (con ventana abierta), médula espinal, cono medular, cola de caballo y filum terminal.<br>– Ojo: córnea, iris, cristalino, cuerpo vítreo, retina, esclerótica, nervio óptico y glándula lagrimal. Oído: conducto auditivo, tímpano, cóclea, vestíbulo, 3 conductos semicirculares y trompa de Eustaquio.<br>– Nariz y boca: cavidad nasal, 4 senos paranasales, parótidas, submandibulares, sublinguales, amígdalas (palatinas, faríngea, lingual), encías, lengua, faringe en 3 partes, cuerdas vocales.<br>– Cuello: tiroides (lóbulos e istmo) y 4 paratiroides. Tórax: timo, tráquea, carina, bronquios principales y lobares, pulmón derecho en 3 lóbulos e izquierdo en 2, pleuras, corazón con 4 cámaras y 4 válvulas, pericardio.<br>– Abdomen: esófago, estómago en 4 partes, duodeno, yeyuno, íleon, ciego, apéndice, colon en 4 partes, recto, canal anal, hígado en 4 lóbulos, vesícula, conductos biliares, páncreas en 3 partes con su conducto, bazo, epiplón y mesenterio.<br>– Urinario: riñones, pelvis renales, uréteres, vejiga, uretra. Suprarrenales.<br>– Reproductor masculino (oculto bajo el bóxer): testículos, epidídimos, conductos deferentes, vesículas seminales, próstata, glándulas bulbouretrales, cuerpos cavernosos y esponjoso, glande, escroto.<br>• Resolución por órgano: oído interno 0,45 mm, ojo 0,6 mm.</p><h3>Novedades v0.7</h3><p class="mut">• Sistema muscular completo por regiones (~690 piezas con nombre y lado, 240 tipos), cada músculo de su origen a su inserción:<br>– Cabeza y cuello: 6 extraoculares y elevador del párpado por ojo, 4 extrínsecos y 4 intrínsecos de la lengua, paladar blando, 3 constrictores de la faringe, laringe (cricotiroideo, cricoaritenoideos, tiroaritenoideo, vocal, aritenoideos), oído medio (tensor del tímpano, estapedio), suboccipitales, prevertebrales, 3 escalenos, esplenios, semiespinosos, elevador de la escápula, infra y suprahioideos.<br>– Tronco: romboides, serratos posteriores, erectores de la columna en 9 partes, multífidos, rotadores y elevadores de las costillas uno por segmento, interespinosos e intertransversos, 33 intercostales por lado (externos, internos e íntimos), diafragma, pared abdominal completa, psoas e ilíaco, suelo pélvico y periné, rotadores profundos de la cadera.<br>– Miembro superior: manguito rotador, 3 porciones del deltoides, cabezas del bíceps y tríceps, los 19 del antebrazo, tenar, hipotenar, 4 lumbricales y 7 interóseos por mano.<br>– Miembro inferior: glúteos, cuádriceps, aductores, isquiotibiales, los 13 de la pierna y las 4 capas de la planta del pie.<br>• Construcción más rápida: rejilla de aceleración y mallas por región.</p><h3>Novedades v0.6</h3><p class="mut">• Esqueleto completo: los 206 huesos del adulto, cada uno con nombre y lado: 22 del cráneo (8 craneales y 14 faciales), 6 huesecillos del oído (martillo, yunque, estribo), hioides, 26 de la columna (24 vértebras, sacro, cóccix), esternón y 24 costillas, y en cada mano 8 del carpo, 5 metacarpianos y 14 falanges que siguen la curva de los dedos; en cada pie 7 del tarso, 5 metatarsianos y 14 falanges.<br>• 32 dientes (incisivos, caninos, premolares, molares y muelas del juicio).<br>• Capa nueva de cartílagos: 23 discos intervertebrales, cartílagos costales, nariz (septal, laterales, alares), orejas, laringe (tiroides, cricoides, aritenoides, epiglotis), meniscos y sínfisis del pubis.<br>• Cabeza por capas: cráneo + 26 tipos de músculos de la cara y el cuello (expresión, masticación, oreja, suprahioideos e infrahioideos) + bolsas de grasa (Bichat, malar, nasolabial, temporal, orbitaria, submentoniana) + cartílagos + piel. Cada capa se ajusta sola para quedar debajo de la piel.<br>• Las capas internas se construyen solo cuando abres el modo Anatomía, así el juego arranca igual de rápido.</p><h3>Novedades v0.5</h3><p class="mut">• La piel ya no es una forma esculpida: se construye por capas como en el cuerpo real. Hueso → músculos con forma de huso (vientre grueso, tendones delgados) → grasa subcutánea con grosor por región → dermis de 2 mm.<br>• Grosores de grasa a 15 %: abdomen ~1,2 cm, flancos ~1 cm, glúteos ~1,4 cm, muslo lateral ~1 cm, parte posterior del brazo ~9 mm, antebrazo 2,5 mm, espinilla y rótula ~1–2 mm (ahí el hueso queda casi bajo la piel), tórax ~6 mm.<br>• Relieves óseos bajo la piel: clavículas, acromion, esternón, escápulas, crestas ilíacas, trocánter, rótula, tibia, maléolos, olécranon, cúbito y muñeca. Ombligo y surco de la columna se ajustan solos a la grasa.<br>• Capa nueva «Grasa subcutánea» (Menú → Anatomía): amarillo más intenso = más grueso.<br>• Control «Grasa corporal» (6–35 %) en el Menú: el cuerpo se reconstruye con más o menos grasa.<br>• La cabeza sigue esculpida (con su grasa facial incluida); se pasará a capas después.</p><h3>Novedades v0.4</h3><p class="mut">• Piel rediseñada con anatomía de superficie: cara con arco de las cejas, párpados, pómulos, nariz con fosas, labios, mentón, mandíbula, orejas con concha y nuez; cuello con esternocleidomastoideos; trapecios, clavículas, pectorales, ombligo, escápulas y surco de la columna; codos, muñecas, manos con nudillos y dedos de 3 falanges algo curvados y uñas; rodillas con rótula y tendón, gemelos, tobillos con maléolos, tendón de Aquiles, arco del pie y 5 dedos con uñas.<br>• Resolución: cabeza 5 mm, manos 4,2 mm, pies 6 mm, cuerpo 1 cm.<br>• Color de piel con poros, rubor (mejillas, nariz, orejas, nudillos, rodillas), palmas y plantas más claras, barba incipiente, pelo con mechones, iris con fibras.<br>• Luz de piel: la luz se dispersa en la piel (aspecto menos de plástico) con un brillo suave.</p><h3>Novedades v0.3</h3><p class="mut">• Personaje nuevo: cuerpo humano delgado, solo en bóxer, piel de vóxeles suavizados (1,2 cm en el cuerpo, 6 mm en las manos con 5 dedos), cara con nariz, orejas, labios, cejas, pelo y ojos con iris y pupila.<br>• Anatomía completa por dentro, oculta: '+ANAT.n.hueso+' huesos/piezas óseas, '+ANAT.n.mus+' músculos y '+ANAT.n.org+' piezas de órganos, cada una con su nombre.<br>• Articulaciones reales: hombro, codo, cadera y rodilla; la cadera baja al dar el paso para que el pie no flote.<br>• Prueba en Menú → «Anatomía» (solo para revisar; en el juego normal solo se ve la piel).</p><p class="mut"><b>Órganos:</b> '+[...ANAT.names.org].join(', ')+'.<br><b>Huesos:</b> '+[...ANAT.names.hueso].join(', ')+'.<br><b>Músculos:</b> '+[...ANAT.names.mus].join(', ')+'.<br>Triángulos: piel '+Math.round(ANAT.tris.piel+ANAT.tris.ojos)+' · músculos '+Math.round(ANAT.tris.mus||0)+' · huesos '+Math.round(ANAT.tris.hueso||0)+' · órganos '+Math.round(ANAT.tris.org||0)+'.</p><h3>Novedades v0.2</h3><p class="mut">• Caminar en 3ª y 1ª persona. Física sobre la densidad del suelo (pendientes, paredes, agua).<br>• Herramienta «Mirar» por defecto.</p><p class="mut">Controles: celular → arrastra en la esquina inferior izquierda para caminar, arrastra en el resto para girar la cámara, pellizca para alejar o acercar. PC → WASD, Shift corre, Espacio salta, arrastra con el ratón para girar, rueda para el zoom.</p><h3>Capas del suelo (de arriba a abajo)</h3>'+MAT.slice(1).map(m=>`<div class="row"><div class="sw" style="background:#${m.c.toString(16).padStart(6,'0')}"></div><div><b>${m.n}</b><br><span class="mut">${m.d}</span></div></div>`).join('')+
 '<p class="mut">Catena: en zonas planas y bajas el suelo es más profundo; en pendientes fuertes es delgado y la roca madre aflora. En la orilla del río el suelo es aluvial (arena y grava). Vóxeles por anillos alrededor del jugador: 1 cm hasta 2 m, 4 cm hasta 8 m, 16 cm hasta 32 m y 64 cm hasta 128 m. El mundo es infinito.</p>'}
/* ===== panel de salud ===== */
let medOn=false,medT=0;
const TXN={presion:'Presión directa',venda:'Vendar',torni:'Torniquete',ligadura:'Ligar arteria',sutura:'Suturar',ferula:'Entablillar'};
function medDraw(){const m=$('med');m.style.display=medOn?'block':'none';$('medB').classList.toggle('on',medOn);if(!medOn)return;
 const l=HP.loss||0,f=v=>Math.round(v);let h='<h3>Salud · '+hpState()+'</h3><div class="vit"><span>Sangre: <b>'+(HP.vol/1000).toFixed(2).replace('.',',')+' L</b> (−'+f(l*100)+' %, clase '+hpClass()+')</span><span>Sangrado: <b>'+f((HP.ext||0)+(HP.int||0))+' mL/min</b>'+(HP.int>1?' ('+f(HP.int)+' interno)':'')+'</span><span>Aire: <b>'+f(HP.air)+' s</b>'+(HP.hyp>0?' (sin aire '+f(HP.hyp)+' s)':'')+'</span><span>Pulso: <b>'+Math.max(0,HP.hr)+' lpm</b></span><span>Presión sistólica: <b>'+HP.sys+' mmHg</b></span><span>Oxígeno: <b>'+f(HP.spo2)+' %</b></span><span>Conciencia: <b>'+f(HP.cons)+' %</b></span><span>Dolor: <b>'+f(HP.pain)+' / 100</b></span><span>Piernas: '+f(HP.legL*100)+' % / '+f(HP.legR*100)+' %</span></div><div class="bar"><i style="width:'+f(HP.vol/50)+'%"></i></div>';
 h+='<div class="mut">Tiempo: <span class="grp" style="display:inline-flex">'+[1,10,60,600].map(v=>'<button class="b'+(HP.tspeed===v?' on':'')+'" data-ts="'+v+'">×'+v+'</button>').join('')+'</span> · <button class="b" data-a="curar" style="display:inline-flex">Curar todo</button></div>';
 if(!HP.inj.length)h+='<p class="mut">Sin lesiones. Elige «Herir», un arma en el Menú y toca al personaje.</p>';
 for(const i of HP.inj.slice().reverse()){const b=bleedOf(i);h+='<div class="inj"><b>#'+i.id+' '+i.where+'</b> <span class="mut">· hace '+fmT(i.age)+(b.ext+b.int>0.5?' · sangra '+Math.round(b.ext+b.int)+' mL/min':'')+'</span><br><span class="mut">'+i.fx.join('<br>')+'</span><br>';
  const opts=['presion','venda'];if(i.limb)opts.push('torni');if(i.bleedArt>0)opts.push('ligadura');if(WPN[i.kind]&&WPN[i.kind].sharp)opts.push('sutura');if(i.fract.length)opts.push('ferula');
  for(const o of opts)h+='<button class="b'+(i.tx[o]?' on':'')+'" data-a="'+o+'" data-i="'+i.id+'">'+TXN[o]+'</button>';
  if(i.tx.torni)h+='<br><span class="mut">Torniquete puesto hace '+fmT(i.age-i.tx.torni)+(i.age-i.tx.torni>7200?' · más de 2 h: riesgo de perder el miembro':'')+'</span>';h+='</div>'}
 m.innerHTML=h}
function fmT(t){return t<90?Math.round(t)+' s':t<5400?Math.round(t/60)+' min':(t/3600).toFixed(1).replace('.',',')+' h'}
$('med').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.ts){HP.tspeed=+b.dataset.ts}else if(b.dataset.a==='curar'){healAll()}else if(b.dataset.a){const i=HP.inj.find(q=>q.id==b.dataset.i);if(i){const a=b.dataset.a;i.tx[a]=i.tx[a]?0:(i.age||.001);if(a==='sutura'&&i.tx.sutura)i.pain*=.8;recalcFx()}}medDraw()});
$('medB').onclick=()=>{medOn=!medOn;medDraw()};$('reviveB').onclick=()=>{healAll();spawn();medDraw()};
document.querySelectorAll('#wpn .b').forEach(b=>b.onclick=()=>{WEAPON=b.dataset.w;document.querySelectorAll('#wpn .b').forEach(o=>o.classList.toggle('on',o===b))});
/* ===== Bucle ===== */
let fc=0,ft=performance.now(),last=performance.now();
function loop(){requestAnimationFrame(loop);const t0=performance.now(),dt=Math.min(.05,(t0-last)/1000);last=t0;let pend=false;
 updateTerrain(pl.x,pl.z,dt,$('load').style.display!=='none'?60:8);waterUpdate(dt);waterDraw(t0/1000);
 if(TPEND===0&&$('load').style.display!=='none')$('load').style.display='none';
 physio(dt*HP.tspeed);bloodTrail(dt*HP.tspeed);physics(dt);updCam();underwater();if(medOn&&(medT+=dt)>.5){medT=0;medDraw()}R.render(S,cam);DRAWN=R.info.render.triangles;fc++;const t=performance.now();if(t-ft>1000){const tt=terrainTris();$('fps').textContent=Math.round(fc*1000/(t-ft))+' FPS · terreno '+Math.round((tt[0]+tt[1]+tt[2]+tt[3])/1000)+' mil triángulos ('+Math.round(DRAWN/1000)+' mil en pantalla)'+' · agua '+WSTAT.ms.toFixed(1)+' ms'+(TPEND?' · '+TPEND+' baldosas por hacer':'');fc=0;ft=t}}
setTimeout(()=>{makeHero();fillLeg();spawn();loop()},30);
</script></body></html>
